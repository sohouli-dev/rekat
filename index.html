<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>رکعت شمار پرهام</title>

<script>
// Inline manifest as data URI to keep everything in one file
(function() {
  const manifest = {
    name: "رکعت شمار پرهام",
    short_name: "رکعت شمار",
    display: "standalone",
    orientation: "landscape",
    start_url: "./",
    background_color: "#111827",
    theme_color: "#111827",
    icons: [
      {
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%23111827'/%3E%3Ctext x='96' y='130' font-size='110' text-anchor='middle' fill='%2372c472'%3E%D8%B1%3C/text%3E%3C/svg%3E",
        sizes: "192x192",
        type: "image/svg+xml"
      }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = url;
  document.currentScript.parentNode.appendChild(link);
})();
</script>

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg:          oklch(14% 0.02 265);
    --surface:     oklch(20% 0.025 265);
    --border:      oklch(32% 0.03 265);
    --text:        oklch(93% 0.01 265);
    --muted:       oklch(58% 0.02 265);
    --accent:      oklch(72% 0.18 145);
    --accent2:     oklch(68% 0.18 265);
    --danger:      oklch(68% 0.18 25);
    --danger-bg:   oklch(22% 0.04 25);
    --touch-bg:    oklch(23% 0.035 265);
    --touch-act:   oklch(34% 0.06 265);
    --touch-wait:  oklch(18% 0.03 265);
    --r-lg: 20px;
    --r-xl: 24px;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .app-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
  }

  .top-status-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px 6px;
    font-size: 13px;
    color: var(--muted);
  }

  .current-prayer-badge {
    color: var(--accent);
    font-weight: 700;
  }

  .fullscreen-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 2px 8px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
  }

  .fullscreen-btn:active { background: var(--surface); }

  .touch-wrap {
    flex: 1;
    width: 100%;
    position: relative;
    display: flex;
    overflow: hidden;
    border-radius: var(--r-xl);
  }

  .touch-zone {
    width: 100%;
    height: 100%;
    background: var(--touch-bg);
    border: 2px dashed var(--border);
    border-radius: var(--r-xl);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    position: relative;
    overflow: hidden;
    transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
  }

  .touch-zone.pressed {
    background: var(--touch-act);
    border-color: var(--accent);
    transform: scale(0.985);
  }

  .touch-zone.cooldown {
    background: var(--touch-wait);
    border-color: oklch(45% 0.08 265);
  }

  .cooldown-bg-fill {
    position: absolute;
    top: 0; bottom: 0; right: 0;
    width: 0%;
    background: oklch(68% 0.18 265 / 22%);
    pointer-events: none;
    z-index: 1;
  }

  .touch-content-wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .touch-label {
    font-size: 17px;
    color: var(--text);
    font-weight: 700;
    text-align: center;
    line-height: 1.8;
  }

  .touch-sublabel {
    font-size: 12px;
    color: var(--muted);
    opacity: 0.8;
    margin-top: 4px;
  }

  .flash {
    position: absolute;
    inset: 0;
    border-radius: var(--r-xl);
    background: oklch(72% 0.18 145 / 20%);
    opacity: 0;
    pointer-events: none;
    z-index: 3;
  }

  .flash.go { animation: flash-anim 250ms ease forwards; }

  @keyframes flash-anim {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  .bottom-row {
    display: flex;
    width: 100%;
    gap: 10px;
    margin-top: 10px;
    height: 95px;
  }

  .counter-card {
    flex: 2;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--r-lg);
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .counter-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .counter-value {
    font-size: 44px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .counter-card.sajdeh .counter-value { color: var(--accent2); }
  .counter-card.rakaat .counter-value { color: var(--accent); }

  .reset-btn-inline {
    flex: 1.2;
    background: var(--danger-bg);
    color: var(--danger);
    border: 1.5px solid oklch(40% 0.1 25);
    border-radius: var(--r-lg);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.3;
    padding: 4px;
    position: relative;
    overflow: hidden;
    touch-action: none;
  }

  .reset-progress {
    position: absolute;
    bottom: 0; right: 0;
    width: 0%;
    height: 4px;
    background: var(--danger);
  }

  .select-overlay, .done-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: oklch(8% 0 0 / 95%);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }

  .select-overlay.show, .done-overlay.show { display: flex; }

  .select-box {
    width: min(500px, 100%);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--r-xl);
    padding: 16px 20px;
    text-align: center;
  }

  .select-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .select-description {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 12px;
  }

  .prayer-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .prayer-btn {
    min-height: 48px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--touch-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .prayer-btn span {
    font-size: 11px;
    color: var(--muted);
    font-weight: normal;
  }

  .prayer-btn:active { background: var(--touch-act); }

  .custom-section {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    background: var(--bg);
    padding: 6px 10px;
    border-radius: 14px;
    border: 1px solid var(--border);
  }

  .stepper-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
  }

  .stepper-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .step-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--touch-bg);
    color: var(--text);
    font-size: 18px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
  }

  .step-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .step-btn:not(:disabled):active { background: var(--touch-act); }

  .stepper-value {
    min-width: 34px;
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    text-align: center;
  }

  .custom-submit-btn {
    flex: 1;
    height: 38px;
    background: var(--accent);
    color: oklch(14% 0.02 145);
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .custom-submit-btn:active { filter: brightness(0.9); }

  .done-box {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .done-text {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.8;
  }

  .done-reset {
    padding: 12px 32px;
    background: var(--accent);
    color: oklch(14% 0.02 145);
    border: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .done-reset:disabled { opacity: 0.5; cursor: default; }

  /* فقط در مرورگر معمولی و portrait */
  .orient-hint {
    display: none;
    position: fixed;
    inset: 0;
    background: oklch(8% 0 0 / 96%);
    color: var(--text);
    font-size: 18px;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    z-index: 999;
    line-height: 2;
  }

  @media (orientation: portrait) and (display-mode: browser) {
    .orient-hint { display: flex; }
  }
</style>
</head>

<body>

<div class="orient-hint">📱 لطفاً گوشی را افقی بگیرید</div>

<div class="app-container">

  <div class="top-status-bar">
    <span id="currentPrayerLabel" class="current-prayer-badge">هنوز نمازی انتخاب نشده</span>
    <button class="fullscreen-btn" id="fullscreenToggleBtn">⛶ تمام‌صفحه</button>
  </div>

  <div class="select-overlay show" id="selectOverlay">
    <div class="select-box">
      <div class="select-title">انتخاب نوع نماز</div>
      <div class="select-description">نماز واجب را انتخاب کنید یا تعداد رکعت دلخواه را تنظیم نمایید:</div>
      <div class="prayer-options">
        <button class="prayer-btn" data-prayer="صبح"  data-rakaat="2" data-type="معمولی">صبح  <span>(۲ رکعت)</span></button>
        <button class="prayer-btn" data-prayer="ظهر"  data-rakaat="4" data-type="معمولی">ظهر  <span>(۴ رکعت)</span></button>
        <button class="prayer-btn" data-prayer="عصر"  data-rakaat="4" data-type="معمولی">عصر  <span>(۴ رکعت)</span></button>
        <button class="prayer-btn" data-prayer="مغرب" data-rakaat="3" data-type="معمولی">مغرب <span>(۳ رکعت)</span></button>
        <button class="prayer-btn" data-prayer="عشا"  data-rakaat="4" data-type="معمولی">عشا  <span>(۴ رکعت)</span></button>
        <div class="custom-section">
          <span class="stepper-label">رکعت دلخواه:</span>
          <div class="stepper-controls">
            <button class="step-btn" id="decRakaatBtn" disabled>−</button>
            <span class="stepper-value" id="customRakaatDisplay">1</span>
            <button class="step-btn" id="incRakaatBtn">+</button>
          </div>
          <button class="custom-submit-btn" id="customSubmitBtn">شروع مستحبی</button>
        </div>
      </div>
    </div>
  </div>

  <div class="done-overlay" id="doneOverlay">
    <div class="done-box">
      <div class="done-text" id="doneText"></div>
      <button class="done-reset" id="doneResetBtn">نماز جدید</button>
    </div>
  </div>

  <div class="touch-wrap">
    <div class="touch-zone" id="touchZone">
      <div class="cooldown-bg-fill" id="cooldownBgFill"></div>
      <div class="touch-content-wrapper">
        <span class="touch-label" id="touchMainLabel">محل حساس به لمس</span>
        <span class="touch-sublabel" id="touchSubLabel">لمس با فاصله کمتر از ۳ ثانیه شمرده نمی‌شود</span>
      </div>
    </div>
    <div class="flash" id="flash"></div>
  </div>

  <div class="bottom-row">
    <div class="counter-card sajdeh">
      <span class="counter-label">سجده</span>
      <span class="counter-value" id="sajdeh-val">0</span>
    </div>
    <button class="reset-btn-inline" id="resetBtn">
      <span>ریست شمارنده</span>
      <span style="font-size:9px;opacity:0.8;">(نگه داشتن ۱.۵ ثانیه)</span>
      <div class="reset-progress" id="resetProgress"></div>
    </button>
    <div class="counter-card rakaat">
      <span class="counter-label">رکعت</span>
      <span class="counter-value" id="rakaat-val">0</span>
    </div>
  </div>

</div>

<script>
(() => {
  const DEBOUNCE_MS  = 3000;
  const RESET_HOLD_MS = 1500;

  let sajdeh = 0, rakaat = 0, maxRakaat = 0;
  let selectedPrayer = '', prayerType = '';
  let isActive = false, isFinished = false;
  let activePointerId = null, lastCountedAt = null;
  let wakeLock = null;
  let customRakaatCount = 1;
  let cooldownAnimFrame = null;
  let resetStartTime = null, progressAnimFrame = null, activeResetPointerId = null;
  let audioCtx = null;

  const $ = id => document.getElementById(id);
  const sajdehEl          = $('sajdeh-val');
  const rakaatEl          = $('rakaat-val');
  const zone              = $('touchZone');
  const touchMainLabel    = $('touchMainLabel');
  const touchSubLabel     = $('touchSubLabel');
  const cooldownBgFill    = $('cooldownBgFill');
  const flashEl           = $('flash');
  const resetBtn          = $('resetBtn');
  const resetProgress     = $('resetProgress');
  const selectOverlay     = $('selectOverlay');
  const doneOverlay       = $('doneOverlay');
  const doneText          = $('doneText');
  const doneResetBtn      = $('doneResetBtn');
  const currentPrayerLabel= $('currentPrayerLabel');
  const fullscreenToggleBtn=$('fullscreenToggleBtn');
  const decRakaatBtn      = $('decRakaatBtn');
  const incRakaatBtn      = $('incRakaatBtn');
  const customRakaatDisplay=$('customRakaatDisplay');
  const customSubmitBtn   = $('customSubmitBtn');
  const prayerButtons     = document.querySelectorAll('.prayer-btn[data-prayer]');

  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(_) {}
  }

  function playFinishSound() {
    try {
      ensureAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
      osc.start(); osc.stop(audioCtx.currentTime + 0.6);
    } catch(_) {}
  }

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      if (!wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch(_) {}
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
  }

  function render() {
    sajdehEl.textContent = sajdeh;
    rakaatEl.textContent = rakaat;
  }

  function triggerFlash() {
    flashEl.classList.remove('go');
    void flashEl.offsetWidth;
    flashEl.classList.add('go');
  }

  function stopCooldown() {
    if (cooldownAnimFrame) { cancelAnimationFrame(cooldownAnimFrame); cooldownAnimFrame = null; }
    cooldownBgFill.style.width = '0%';
    zone.classList.remove('cooldown');
    touchMainLabel.textContent = 'محل حساس به لمس';
    touchSubLabel.textContent  = 'لمس با فاصله کمتر از ۳ ثانیه شمرده نمی‌شود';
  }

  function startCooldownIndicator() {
    if (cooldownAnimFrame) cancelAnimationFrame(cooldownAnimFrame);
    zone.classList.add('cooldown');
    touchMainLabel.textContent = '⏳ در حال ثبت...';
    touchSubLabel.textContent  = 'آماده‌سازی لمس بعدی';
    const start = Date.now();
    (function step() {
      const elapsed = Date.now() - start;
      cooldownBgFill.style.width = Math.min((elapsed / DEBOUNCE_MS) * 100, 100) + '%';
      if (elapsed < DEBOUNCE_MS) cooldownAnimFrame = requestAnimationFrame(step);
      else stopCooldown();
    })();
  }

  function startPrayer(name, rakaatCount, type = 'معمولی') {
    ensureAudio();
    selectedPrayer = name; maxRakaat = Number(rakaatCount); prayerType = type;
    rakaat = 1; sajdeh = 0; isActive = true; isFinished = false; lastCountedAt = null;
    currentPrayerLabel.textContent = prayerType === 'مستحبی'
      ? `نماز مستحبی (${maxRakaat} رکعت)`
      : `نماز ${selectedPrayer} (${maxRakaat} رکعت)`;
    selectOverlay.classList.remove('show');
    doneOverlay.classList.remove('show');
    requestWakeLock();
    render();
  }

  function resetAndChoosePrayer() {
    stopCooldown();
    sajdeh = 0; rakaat = 0; maxRakaat = 0;
    selectedPrayer = ''; prayerType = '';
    isActive = false; isFinished = false;
    activePointerId = null; lastCountedAt = null;
    currentPrayerLabel.textContent = 'هنوز نمازی انتخاب نشده';
    zone.classList.remove('pressed');
    doneOverlay.classList.remove('show');
    releaseWakeLock();
    render();
    selectOverlay.classList.add('show');
    if (navigator.vibrate) navigator.vibrate([25, 40, 25]);
  }

  function countSajdeh() {
    if (!isActive || isFinished) return;
    if (sajdeh === 0) {
      sajdeh = 1;
    } else if (sajdeh === 1) {
      sajdeh = 2;
    } else {
      if (rakaat < maxRakaat) { rakaat++; sajdeh = 1; }
      else {
        rakaat = maxRakaat; sajdeh = 2; isFinished = true;
        stopCooldown(); render(); triggerFlash(); playFinishSound();
        const title = prayerType === 'مستحبی'
          ? `نماز مستحبی (${maxRakaat} رکعت)`
          : `نماز ${selectedPrayer}`;
        doneText.innerHTML = `${title} کامل شد 🌙<br>${maxRakaat} رکعت تمام`;
        doneOverlay.classList.add('show');
        return;
      }
    }
    triggerFlash(); render(); startCooldownIndicator();
  }

  // Touch zone events
  zone.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!isActive || isFinished || activePointerId !== null) return;
    activePointerId = e.pointerId;
    zone.classList.add('pressed');
    try { zone.setPointerCapture(e.pointerId); } catch(_) {}
  });

  zone.addEventListener('pointerup', e => {
    e.preventDefault();
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    zone.classList.remove('pressed');
    const now = Date.now();
    if (lastCountedAt !== null && now - lastCountedAt < DEBOUNCE_MS) return;
    lastCountedAt = now;
    countSajdeh();
  });

  zone.addEventListener('pointercancel', e => {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    zone.classList.remove('pressed');
  });

  // Reset button hold
  function cancelResetHold() {
    if (progressAnimFrame) { cancelAnimationFrame(progressAnimFrame); progressAnimFrame = null; }
    resetProgress.style.width = '0%';
    resetStartTime = null; activeResetPointerId = null;
  }

  resetBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (activeResetPointerId !== null) return;
    activeResetPointerId = e.pointerId;
    try { resetBtn.setPointerCapture(e.pointerId); } catch(_) {}
    resetStartTime = Date.now();
    (function update() {
      const elapsed = Date.now() - resetStartTime;
      resetProgress.style.width = Math.min((elapsed / RESET_HOLD_MS) * 100, 100) + '%';
      if (elapsed >= RESET_HOLD_MS) { cancelResetHold(); resetAndChoosePrayer(); }
      else progressAnimFrame = requestAnimationFrame(update);
    })();
  });

  resetBtn.addEventListener('pointerup',     cancelResetHold);
  resetBtn.addEventListener('pointercancel', cancelResetHold);

  // Fullscreen
  fullscreenToggleBtn.addEventListener('click', () => {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen().catch(()=>{});
    else if (document.exitFullscreen)
      document.exitFullscreen().catch(()=>{});
  });

  // Stepper
  incRakaatBtn.addEventListener('click', () => {
    if (customRakaatCount < 50) {
      customRakaatCount++;
      customRakaatDisplay.textContent = customRakaatCount;
      decRakaatBtn.disabled = false;
    }
  });

  decRakaatBtn.addEventListener('click', () => {
    if (customRakaatCount > 1) {
      customRakaatCount--;
      customRakaatDisplay.textContent = customRakaatCount;
      if (customRakaatCount === 1) decRakaatBtn.disabled = true;
    }
  });

  // Prayer selection
  prayerButtons.forEach(btn => btn.addEventListener('click', () =>
    startPrayer(btn.dataset.prayer, btn.dataset.rakaat, btn.dataset.type)
  ));

  customSubmitBtn.addEventListener('click', () =>
    startPrayer('مستحبی', customRakaatCount, 'مستحبی')
  );

  doneResetBtn.addEventListener('click', resetAndChoosePrayer);

  render();
})();
</script>
</body>
</html>
