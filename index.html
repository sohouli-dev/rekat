<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111827">
  <title>رکعت شمار پرهام</title>

  <!-- آیکون و تنظیمات PWA -->
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* هشدار حالت عمودی */
    .orient-hint {
      display: none;
      background: #e11d48;
      color: #ffffff;
      text-align: center;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      z-index: 1000;
    }

    @media (orientation: portrait) {
      .orient-hint {
        display: block;
      }
    }

    /* نوار بالا */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 0.85rem;
      height: 44px;
      flex-shrink: 0;
    }

    .top-bar .title {
      font-weight: 700;
      color: #38bdf8;
    }

    .top-bar .prayer-name {
      color: #94a3b8;
    }

    .btn-change {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-change:hover {
      background: #475569;
    }

    /* بدنه اصلی برنامه */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .counter-screen {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 12px;
      padding: 10px 14px;
      overflow: hidden;
    }

    /* منطقه لمس (Touch Zone) */
    .touch-zone {
      flex: 1;
      background: #1e293b;
      border: 2px dashed #475569;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      padding: 10px;
      text-align: center;
      position: relative;
    }

    .touch-zone:active {
      background: #24344d;
      border-color: #38bdf8;
    }

    .touch-zone .icon {
      font-size: 2.5rem;
      margin-bottom: 4px;
    }

    .touch-zone .label {
      font-size: 1.1rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    .touch-zone .sub-label {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 2px;
    }

    .touch-zone .status-text {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #38bdf8;
    }

    /* ستون شمارنده‌ها و دکمه‌ها */
    .stats-sidebar {
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: space-between;
    }

    .stat-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-card.active-sajdah {
      border-color: #22c55e;
      background: #143324;
    }

    .stat-card .label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .stat-card .val {
      font-size: 1.6rem;
      font-weight: 800;
      color: #f8fafc;
      min-width: 45px;
      text-align: left;
    }

    .sajdah-dots {
      display: flex;
      gap: 6px;
    }

    .sajdah-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #334155;
      border: 1px solid #64748b;
    }

    .sajdah-dot.filled {
      background: #22c55e;
      border-color: #4ade80;
    }

    /* دکمه‌های کنترلی با قابلیت نگه‌داشتن */
    .control-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-hold-btn {
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px;
      cursor: pointer;
      color: #ffffff;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }

    .action-hold-btn .progress-bar {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 0%;
      background: rgba(255, 255, 255, 0.25);
      transition: width 0.05s linear;
    }

    .action-hold-btn span {
      position: relative;
      z-index: 1;
    }

    .reset-btn {
      background: #f59e0b;
    }

    .exit-btn {
      background: #ef4444;
    }

    /* مودال انتخاب نماز */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: #0f172acc;
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
      gap: 12px;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px 20px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .modal-card h2 {
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }

    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .prayer-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 10px 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      font-family: inherit;
    }

    .prayer-btn:hover {
      background: #475569;
    }

    .prayer-btn .detail {
      font-size: 0.7rem;
      color: #94a3b8;
    }

    /* دکمه خروج بیرون کادر انتخاب */
    .exit-btn-modal {
      width: 100%;
      max-width: 440px;
    }

    /* پایان نماز */
    .done-overlay {
      position: absolute;
      inset: 0;
      background: #0f172ae6;
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 16px;
    }

    .done-overlay.hidden {
      display: none;
    }

    .done-card {
      background: #1e293b;
      border: 2px solid #22c55e;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .done-card h2 {
      color: #22c55e;
      font-size: 1.3rem;
    }

    .done-card p {
      color: #cbd5e1;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .btn-new-prayer {
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-new-prayer:hover {
      background: #0369a1;
    }

    /* کادر اعلان کوتاه (Toast) */
    .toast-msg {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #334155;
      color: #f8fafc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 100;
      border: 1px solid #64748b;
    }

    .toast-msg.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- پیام راهنما برای چرخش گوشی به همراه ایموجی موبایل -->
  <div class="orient-hint">
    📱 لطفاً برای استفاده، گوشی را به حالت افقی نگه دارید
  </div>

  <!-- نوار بالای صفحه -->
  <header class="top-bar">
    <div class="title">رکعت شمار پرهام</div>
    <div class="prayer-name" id="currentPrayerLabel">نماز مغرب (۳ رکعت)</div>
    <button class="btn-change" id="changePrayerBtn">تغییر نماز</button>
  </header>

  <!-- بدنه اصلی -->
  <main class="app-main">
    <div class="counter-screen">
      <!-- محل لمس بزرگ برای سجده -->
      <div class="touch-zone" id="touchZone" role="button" tabindex="0">
        <div class="icon">✋</div>
        <div class="label">برای ثبت سجده لمس کنید</div>
        <div class="sub-label">(یا پیشانی را روی این قسمت بگذارید)</div>
        <div class="status-text" id="statusText">در انتظار شروع...</div>
      </div>

      <!-- ستون کناری شمارنده‌ها و دکمه‌ها -->
      <aside class="stats-sidebar">
        <div class="stat-cards">
          <!-- کارت رکعت -->
          <div class="stat-card">
            <span class="label">رکعت</span>
            <span class="val" id="rakaatVal">۱ / ۳</span>
          </div>

          <!-- کارت سجده -->
          <div class="stat-card" id="sajdahCard">
            <div>
              <div class="label">سجده</div>
              <div class="sajdah-dots" style="margin-top: 4px;">
                <div class="sajdah-dot" id="dot1"></div>
                <div class="sajdah-dot" id="dot2"></div>
              </div>
            </div>
            <span class="val" id="sajdahVal">۰</span>
          </div>
        </div>

        <!-- دکمه‌های کنترل: ریست بالا، خروج پایین -->
        <div class="control-actions">
          <!-- دکمه ریست (نگه داشتن ۱.۵ ثانیه) -->
          <button class="action-hold-btn reset-btn" id="resetCounterBtn">
            <div class="progress-bar" id="resetProgress"></div>
            <span>ریست شمارنده</span>
          </button>

          <!-- دکمه خروج (نگه داشتن ۱ ثانیه) -->
          <button class="action-hold-btn exit-btn" id="exitAppBtn">
            <div class="progress-bar" id="exitProgress"></div>
            <span>خروج از برنامه</span>
          </button>
        </div>
      </aside>
    </div>

    <!-- مودال انتخاب نماز -->
    <div class="modal-overlay hidden" id="prayerModal">
      <div class="modal-card">
        <h2>انتخاب نوع نماز</h2>
        <div class="prayer-grid">
          <button class="prayer-btn" data-name="صبح" data-rakaat="2">
            <span>صبح</span>
            <span class="detail">۲ رکعت</span>
          </button>
          <button class="prayer-btn" data-name="ظهر" data-rakaat="4">
            <span>ظهر</span>
            <span class="detail">۴ رکعت</span>
          </button>
          <button class="prayer-btn" data-name="عصر" data-rakaat="4">
            <span>عصر</span>
            <span class="detail">۴ رکعت</span>
          </button>
          <button class="prayer-btn" data-name="مغرب" data-rakaat="3">
            <span>مغرب</span>
            <span class="detail">۳ رکعت</span>
          </button>
          <button class="prayer-btn" data-name="عشاء" data-rakaat="4">
            <span>عشاء</span>
            <span class="detail">۴ رکعت</span>
          </button>
          <button class="prayer-btn" data-name="مستحبی" data-rakaat="2">
            <span>مستحبی</span>
            <span class="detail">۲ رکعت</span>
          </button>
        </div>
      </div>
      <!-- دکمه خروج بیرون کادر انتخاب نماز -->
      <button class="action-hold-btn exit-btn exit-btn-modal" id="exitSelectBtn">
        <div class="progress-bar" id="exitSelectProgress"></div>
        <span>خروج از برنامه</span>
      </button>
    </div>

    <!-- کادر پایان نماز به همراه ایموجی ماه 🌙 -->
    <div class="done-overlay hidden" id="doneOverlay">
      <div class="done-card">
        <h2>قبول باشد</h2>
        <p id="doneText">نماز مغرب کامل شد 🌙<br>۳ رکعت تمام</p>
        <button class="btn-new-prayer" id="newPrayerBtn">نماز جدید</button>
        <!-- دکمه خروج زیر نماز جدید -->
        <button class="action-hold-btn exit-btn" id="exitDoneBtn">
          <div class="progress-bar" id="exitDoneProgress"></div>
          <span>خروج از برنامه</span>
        </button>
      </div>
    </div>

    <!-- اعلان پیام تاچ زودهنگام -->
    <div class="toast-msg" id="toastMsg"></div>
  </main>

  <script>
    // متغیرهای وضعیت
    let selectedPrayer = 'مغرب';
    let maxRakaat = 3;
    let currentRakaat = 1;
    let currentSajdah = 0;
    let lastTapTime = 0;
    const DEBOUNCE_TIME = 3000; // تاخیر ۳ ثانیه‌ای بین سجده‌ها

    // ارجاع به المان‌های صفحه
    const touchZone = document.getElementById('touchZone');
    const rakaatVal = document.getElementById('rakaatVal');
    const sajdahVal = document.getElementById('sajdahVal');
    const dot1 = document.getElementById('dot1');
    const dot2 = document.getElementById('dot2');
    const sajdahCard = document.getElementById('sajdahCard');
    const statusText = document.getElementById('statusText');
    const currentPrayerLabel = document.getElementById('currentPrayerLabel');
    const prayerModal = document.getElementById('prayerModal');
    const changePrayerBtn = document.getElementById('changePrayerBtn');
    const doneOverlay = document.getElementById('doneOverlay');
    const doneText = document.getElementById('doneText');
    const newPrayerBtn = document.getElementById('newPrayerBtn');
    const toastMsg = document.getElementById('toastMsg');

    // تابع نمایش پیام Toast
    function showToast(text) {
      toastMsg.innerText = text;
      toastMsg.classList.add('show');
      setTimeout(() => {
        toastMsg.classList.remove('show');
      }, 1500);
    }

    // به‌روزرسانی رابط کاربری
    function updateUI() {
      currentPrayerLabel.innerText = `نماز ${selectedPrayer} (${maxRakaat} رکعت)`;
      rakaatVal.innerText = `${currentRakaat} / ${maxRakaat}`;
      sajdahVal.innerText = currentSajdah;

      dot1.classList.toggle('filled', currentSajdah >= 1);
      dot2.classList.toggle('filled', currentSajdah >= 2);

      if (currentSajdah > 0) {
        sajdahCard.classList.add('active-sajdah');
      } else {
        sajdahCard.classList.remove('active-sajdah');
      }

      if (currentSajdah === 0) {
        statusText.innerText = `رکعت ${currentRakaat} - سجده اول را بجا آورید`;
      } else if (currentSajdah === 1) {
        statusText.innerText = `رکعت ${currentRakaat} - سجده دوم را بجا آورید`;
      }
    }

    // منطق ثبت لمس سجده
    function registerSajdah() {
      const now = Date.now();
      if (now - lastTapTime < DEBOUNCE_TIME) {
        showToast('فاصله بین دو سجده حداقل ۳ ثانیه است');
        return;
      }
      lastTapTime = now;

      currentSajdah++;

      if (currentSajdah === 2) {
        updateUI();
        if (currentRakaat === maxRakaat) {
          // پایان نماز همراه با ایموجی ماه 🌙
          setTimeout(() => {
            doneText.innerHTML = `نماز ${selectedPrayer} کامل شد 🌙<br>${maxRakaat} رکعت تمام`;
            doneOverlay.classList.remove('hidden');
          }, 400);
        } else {
          // رفتن به رکعت بعدی
          setTimeout(() => {
            currentRakaat++;
            currentSajdah = 0;
            updateUI();
          }, 400);
        }
      } else {
        updateUI();
      }
    }

    // لیسنرهای لمس منطقه سجده
    touchZone.addEventListener('pointerup', (e) => {
      e.preventDefault();
      registerSajdah();
    });

    touchZone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        registerSajdah();
      }
    });

    // منطق نگه داشتن دکمه (Hold to Trigger)
    function setupHoldButton(btnId, progressId, duration, onComplete) {
      const btn = document.getElementById(btnId);
      const prog = document.getElementById(progressId);
      let timer = null;
      let startTime = 0;

      function start(e) {
        e.preventDefault();
        startTime = Date.now();
        prog.style.width = '0%';
        timer = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const percent = Math.min((elapsed / duration) * 100, 100);
          prog.style.width = percent + '%';
          if (elapsed >= duration) {
            cancel();
            onComplete();
          }
        }, 30);
      }

      function cancel() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        prog.style.width = '0%';
      }

      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', cancel);
      btn.addEventListener('pointerleave', cancel);
      btn.addEventListener('pointercancel', cancel);
    }

    // ریست کردن وضعیت نماز
    function resetPrayerState() {
      currentRakaat = 1;
      currentSajdah = 0;
      updateUI();
    }

    // تابع بستن برنامه
    function closeApplication() {
      window.close();
      setTimeout(() => {
        showToast('برای بستن کامل، از دکمه هوم یا بستن پنجره استفاده کنید');
      }, 300);
    }

    // راه‌اندازی دکمه ریست شمارنده (۱.۵ ثانیه)
    setupHoldButton('resetCounterBtn', 'resetProgress', 1500, () => {
      resetPrayerState();
      showToast('شمارنده بازنشانی شد');
    });

    // راه‌اندازی دکمه‌های خروج (۱ ثانیه)
    setupHoldButton('exitAppBtn', 'exitProgress', 1000, closeApplication);
    setupHoldButton('exitSelectBtn', 'exitSelectProgress', 1000, closeApplication);
    setupHoldButton('exitDoneBtn', 'exitDoneProgress', 1000, closeApplication);

    // مدیریت مودال انتخاب نماز
    changePrayerBtn.addEventListener('click', () => {
      prayerModal.classList.remove('hidden');
    });

    document.querySelectorAll('.prayer-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const target = e.currentTarget;
        selectedPrayer = target.dataset.name;
        maxRakaat = parseInt(target.dataset.rakaat, 10);
        resetPrayerState();
        prayerModal.classList.add('hidden');
      });
    });

    // دکمه شروع نماز جدید
    newPrayerBtn.addEventListener('click', () => {
      doneOverlay.classList.add('hidden');
      prayerModal.classList.remove('hidden');
    });

    // مقداردهی اولیه
    updateUI();
  </script>
</body>
</html>
