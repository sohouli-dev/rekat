<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111827">

  <title>رکعت شمار پرهام</title>

  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #111827;
      --surface: #1f2937;
      --border: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #10b981;
      --accent-dark: #064e3b;
      --accent2: #6366f1;
      --reset-btn-bg: #2e1065;
      --reset-btn-border: #581c87;
      --reset-btn-text: #c084fc;
      --danger: #ef4444;
      --danger-bg: #450a0a;
      --danger-border: #7f1d1d;
      --touch-bg: #1e293b;
      --touch-act: #334155;
      --touch-wait: #0f172a;
      --r-lg: 16px;
      --r-xl: 20px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Vazirmatn",
        "Vazir",
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font-family: inherit;
      -webkit-user-select: none;
      user-select: none;
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
    }

    /* محل اصلی لمس */

    .touch-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      overflow: hidden;
      border-radius: var(--r-xl);
    }

    .touch-zone {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--touch-bg);
      border: 2px dashed var(--border);
      border-radius: var(--r-xl);
      cursor: pointer;
      touch-action: manipulation;
    }

    .touch-zone.cooldown {
      background: var(--touch-wait);
      border-color: #4b5563;
    }

    /* متن دعای پس‌زمینه با فاصله نیم‌سانتی از کناره‌ها و ۳ میلی‌متر تا متن پایین */
    .dua-bg-container {
      position: absolute;
      top: 18px;
      right: 18px;
      left: 18px;
      bottom: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
      pointer-events: none;
      text-align: center;
      overflow: hidden;
    }

    .dua-text {
      width: 100%;
      color: #cbd5e1;
      opacity: 0.58;
      font-weight: 700;
      line-height: 1.45;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      user-select: none;
      word-break: break-word;
      display: inline-block;
    }

    .cooldown-bg-fill {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 0%;
      background: rgba(99, 102, 241, 0.25);
      pointer-events: none;
      z-index: 1;
    }

    /* انتقال متن محل حساس به لمس به پایین کادر */
    .touch-content-wrapper {
      position: absolute;
      right: 50%;
      bottom: 8px;
      transform: translateX(50%);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }

    .touch-label {
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .touch-prayer-info {
      position: absolute;
      right: 12px;
      bottom: 10px;
      z-index: 3;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .touch-sublabel {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 3;
      opacity: 0;
      border-radius: var(--r-xl);
      background: rgba(16, 185, 129, 0.25);
      pointer-events: none;
    }

    .flash.go {
      animation: flash-animation 250ms ease forwards;
    }

    @keyframes flash-animation {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* افکت انیمیشن موجی لمس (Ripple Effect) */
    .touch-ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, rgba(16, 185, 129, 0.25) 50%, rgba(16, 185, 129, 0) 100%);
      transform: scale(0);
      animation: ripple-animation 600ms cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes ripple-animation {
      0% {
        transform: scale(0);
        opacity: 1;
      }
      100% {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    /* ردیف پایین صفحه اصلی */

    .bottom-row {
      display: flex;
      width: 100%;
      height: 90px;
      gap: 10px;
      margin-top: 8px;
    }

    .counter-card {
      flex: 1.33;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1px;
      padding: 2px 4px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-lg);
    }

    .counter-label {
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
    }

    .counter-value {
      font-size: 64px;
      font-weight: 900;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }

    .counter-card.sajdeh .counter-value {
      color: var(--accent2);
    }

    .counter-card.rakaat .counter-value {
      color: var(--accent);
    }

    .counter-card.action-card {
      flex: 2;
      order: 3;
    }

    .counter-card.action-card {
      flex-direction: row;
      gap: 10px;
    }

    .action-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }

    .counter-card.sajdeh {
      order: 1;
    }

    .counter-card.rakaat {
      order: 2;
    }

    .center-controls {
      order: 4;
    }

    /*
      دکمه‌ها:
      ریست در بالا (تم بنفش ملایم)
      خروج در پایین (تم قرمز)
    */

    .center-controls {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reset-btn-inline,
    .exit-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    .reset-btn-inline {
      flex: 1.3;
      flex-direction: column;
      background: var(--reset-btn-bg);
      border: 1.5px solid var(--reset-btn-border);
      border-radius: var(--r-lg);
      color: var(--reset-btn-text);
      font-size: 11px;
      font-weight: 700;
    }

    .exit-btn {
      flex: 1;
      min-height: 40px;
      background: var(--danger-bg);
      border: 1.5px solid var(--danger-border);
      border-radius: var(--r-lg);
      color: var(--danger);
      font-size: 11px;
      font-weight: 700;
    }

    .reset-btn-inline:active,
    .exit-btn:active {
      background: var(--touch-act);
    }

    .reset-btn-inline:active {
      color: var(--reset-btn-text);
    }

    .exit-btn:active {
      color: var(--danger);
    }

    .reset-progress,
    .exit-progress {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 0%;
      height: 4px;
      pointer-events: none;
    }

    .reset-progress {
      background: var(--reset-btn-text);
    }

    .exit-progress {
      background: var(--danger);
    }

    /* پیام‌های کوتاه */

    .toast {
      position: fixed;
      right: 50%;
      bottom: 20px;
      z-index: 100000;
      max-width: min(90%, 420px);
      padding: 10px 16px;
      transform: translateX(50%) translateY(20px);
      opacity: 0;
      color: var(--text);
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
      pointer-events: none;
      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .toast.show {
      transform: translateX(50%) translateY(0);
      opacity: 1;
    }

    /* صفحه انتخاب نماز و صفحه پایان */

    .select-overlay,
    .done-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(10, 10, 15, 0.96);
    }

    .select-overlay.show,
    .done-overlay.show {
      display: flex;
    }

    .select-overlay {
      flex-direction: column;
    }

    .select-box {
      width: min(500px, 100%);
      padding: 16px 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-xl);
      text-align: center;
    }

    .select-title {
      margin-bottom: 4px;
      font-size: 18px;
      font-weight: 700;
    }

    .select-description {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .prayer-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .prayer-btn {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      background: var(--touch-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .prayer-btn:active {
      background: var(--touch-act);
    }

    .custom-section {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .stepper-label {
      color: var(--muted);
      font-size: 12px;
    }

    .stepper-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-btn {
      width: 36px;
      height: 36px;
      background: var(--touch-bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .stepper-value {
      min-width: 30px;
      color: var(--accent);
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }

    .custom-submit-btn {
      flex: 1;
      height: 36px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .select-overlay > .overlay-exit-btn {
      flex: none;
      width: min(220px, 80%);
      height: 48px;
      min-height: 48px;
      margin-top: 14px;
    }

    .done-box {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .done-text {
      color: var(--accent);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.8;
    }

    .done-reset {
      padding: 12px 32px;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      color: var(--accent-dark);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .done-box .overlay-exit-btn {
      flex: none;
      width: min(220px, 80vw);
      height: 48px;
      min-height: 48px;
    }

    /* پاپ‌آپ به‌روزرسانی دعاها */
    .update-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(2px);
    }

    .update-overlay.show {
      display: flex;
    }

    .update-box {
      width: min(380px, 92%);
      padding: 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-xl);
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .update-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .update-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .update-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .update-btn-confirm {
      flex: 1;
      height: 40px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .update-btn-cancel {
      flex: 1;
      height: 40px;
      background: var(--touch-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* پیام چرخاندن گوشی */

    .orient-hint {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: rgba(10, 10, 15, 0.98);
      color: var(--text);
      font-size: 18px;
      text-align: center;
    }

    @media (orientation: portrait) {
      .orient-hint {
        display: flex;
      }
    }

    @media (max-width: 560px) {
      .app-container {
        padding: 8px;
      }

      .bottom-row {
        height: 82px;
        gap: 6px;
      }

      .counter-label {
        font-size: 14px;
      }

      .counter-value {
        font-size: 48px;
      }

      .touch-label {
        font-size: 13px;
      }

      .touch-sublabel {
        font-size: 10px;
      }

      .select-box {
        padding: 12px;
      }

      .prayer-options {
        gap: 6px;
      }

      .prayer-btn {
        min-height: 42px;
        font-size: 12px;
      }

      .done-text {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="orient-hint">
    لطفاً برای استفاده، گوشی را به حالت افقی نگه دارید
  </div>

  <div class="app-container">

    <!-- محل لمس و شمارش -->

    <div class="touch-wrap">
      <div
        class="touch-zone"
        id="touchZone"
        role="button"
        tabindex="0"
        aria-label="محل حساس به لمس برای شمارش"
      >
        <!-- لایه پس‌زمینه متن دعا -->
        <div class="dua-bg-container" id="duaContainer">
          <span class="dua-text" id="duaText"></span>
        </div>

        <div
          class="cooldown-bg-fill"
          id="cooldownBgFill"
        ></div>

        <!-- انتقال متن‌ها به پایین کادر لمس -->
        <div class="touch-content-wrapper">
          <span
            class="touch-label"
            id="touchMainLabel"
          >
            محل حساس به لمس
          </span>

          <span
            class="touch-sublabel"
            id="touchSubLabel"
          >
            لمس با فاصله کمتر از ۳ ثانیه شمرده نمی‌شود
          </span>
        </div>

        <span
          class="touch-prayer-info"
          id="touchPrayerInfo"
        ></span>
      </div>

      <div
        class="flash"
        id="flash"
      ></div>
    </div>

    <!-- شمارنده‌ها و دکمه‌های کنترلی -->

    <div class="bottom-row">

      <div class="counter-card sajdeh">
        <span class="counter-label">سجده</span>
        <span
          class="counter-value"
          id="sajdeh-val"
        >
          0
        </span>
      </div>

      <div class="center-controls">

        <!-- دکمه ریست در بالا (تم بنفش ملایم) -->

        <button
          type="button"
          class="reset-btn-inline"
          id="resetBtn"
          aria-label="ریست شمارنده با نگه داشتن یک و نیم ثانیه"
        >
          <span>ریست شمارنده</span>

          <span style="font-size: 9px; opacity: 0.85;">
            نگه داشتن ۱.۵ ثانیه
          </span>

          <div
            class="reset-progress"
            id="resetProgress"
          ></div>
        </button>

        <!-- دکمه خروج در پایین (تم قرمز) -->

        <button
          type="button"
          class="exit-btn"
          id="exitMainBtn"
          aria-label="خروج با نگه داشتن یک ثانیه"
        >
          <span>✕ خروج</span>

          <div class="exit-progress"></div>
        </button>

      </div>

      <div class="counter-card rakaat">
        <span class="counter-label">رکعت</span>
        <span
          class="counter-value"
          id="rakaat-val"
        >
          0
        </span>
      </div>

      <div class="counter-card action-card">
        <span class="counter-label">اقدام بعدی</span>
        <span class="action-text" id="nextActionText"></span>
      </div>

    </div>

  </div>

  <!-- صفحه انتخاب نوع نماز -->

  <div
    class="select-overlay show"
    id="selectOverlay"
  >
    <div class="select-box">

      <div class="select-title">
        انتخاب نوع نماز
      </div>

      <div class="select-description">
        یک نماز را انتخاب کنید:
      </div>

      <div class="prayer-options">

        <button
          type="button"
          class="prayer-btn"
          onclick="startPrayer('صبح', 2)"
        >
          صبح
          <span>(۲ رکعت)</span>
        </button>

        <button
          type="button"
          class="prayer-btn"
          onclick="startPrayer('ظهر', 4)"
        >
          ظهر
          <span>(۴ رکعت)</span>
        </button>

        <button
          type="button"
          class="prayer-btn"
          onclick="startPrayer('عصر', 4)"
        >
          عصر
          <span>(۴ رکعت)</span>
        </button>

        <button
          type="button"
          class="prayer-btn"
          onclick="startPrayer('مغرب', 3)"
        >
          مغرب
          <span>(۳ رکعت)</span>
        </button>

        <button
          type="button"
          class="prayer-btn"
          onclick="startPrayer('عشا', 4)"
        >
          عشا
          <span>(۴ رکعت)</span>
        </button>

        <div class="custom-section">

          <span class="stepper-label">
            رکعت:
          </span>

          <div class="stepper-controls">

            <button
              type="button"
              class="step-btn"
              onclick="changeCustom(-1)"
              aria-label="کاهش تعداد رکعت"
            >
              −
            </button>

            <span
              class="stepper-value"
              id="customRakaatDisplay"
            >
              1
            </span>

            <button
              type="button"
              class="step-btn"
              onclick="changeCustom(1)"
              aria-label="افزایش تعداد رکعت"
            >
              +
            </button>

          </div>

          <button
            type="button"
            class="custom-submit-btn"
            onclick="startCustomPrayer()"
          >
            نماز مستحب با رکعت دلخواه
          </button>

        </div>

      </div>

    </div>

    <!-- خروج خارج از کادر انتخاب نماز و در پایین آن (تم قرمز) -->

    <button
      type="button"
      class="exit-btn overlay-exit-btn"
      id="exitSelectBtn"
      aria-label="خروج با نگه داشتن یک ثانیه"
    >
      <span>✕ خروج</span>

      <div class="exit-progress"></div>
    </button>

  </div>

  <!-- صفحه پایان نماز -->

  <div
    class="done-overlay"
    id="doneOverlay"
  >
    <div class="done-box">

      <div
        class="done-text"
        id="doneText"
      ></div>

      <button
        type="button"
        class="done-reset"
        onclick="resetAndChoosePrayer()"
      >
        نماز جدید
      </button>

      <!-- خروج زیر دکمه نماز جدید (تم قرمز) -->

      <button
        type="button"
        class="exit-btn overlay-exit-btn"
        id="exitDoneBtn"
        aria-label="خروج با نگه داشتن یک ثانیه"
      >
        <span>✕ خروج</span>

        <div class="exit-progress"></div>
      </button>

    </div>
  </div>

  <!-- مودال سوال برای به‌روزرسانی دعاها -->
  <div class="update-overlay" id="updateOverlay">
    <div class="update-box">
      <div class="update-title">به‌روزرسانی دعاها</div>
      <div class="update-desc">
        نسخه جدیدی از دعاهای قنوت در دسترس است. آیا مایلید دعاها به‌روزرسانی شوند؟
      </div>
      <div class="update-actions">
        <button
          type="button"
          class="update-btn-confirm"
          id="confirmUpdateBtn"
        >
          بله، به‌روزرسانی شود
        </button>
        <button
          type="button"
          class="update-btn-cancel"
          id="cancelUpdateBtn"
        >
          خیر
        </button>
      </div>
    </div>
  </div>

  <!-- پیام خروج یا پیام‌های کوتاه -->

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    let sajdeh = 0;
    let rakaat = 0;
    let maxRakaat = 0;
    let selectedPrayer = "";
    let isActive = false;
    let isFinished = false;
    let lastCountedAt = 0;
    let customRakaatCount = 1;

    const DEBOUNCE_MS = 3000;
    const RESET_HOLD_MS = 1500;
    const EXIT_HOLD_MS = 1000;

    // متن «اقدام بعدی» بر اساس تعداد رکعت نماز و رکعت تمام‌شده (هر سطر یک خط)
    const ACTION_TEXTS = {
      2: { 1: ["قنوت","تشهد", "سلام"] },
      3: { 1: ["قنوت", "تشهد"], 2: ["تشهد", "سلام"] },
      4: { 1: ["قنوت", "تشهد"], 2: ["تسبیحات اربعه"], 3: ["تشهد", "سلام"] }
    };

    let nextActionLines = [];

    let toastTimer = null;

    /* پایگاه دعاهای پیش‌فرض و آفلاین */
    const DEFAULT_DUAS = [
      "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
      "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ",
      "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ",
      "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي",
      "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ",
      "لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ",
      "اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَعَافِنِي وَاهْدِنِي وَارْزُقْنِي"
    ];

    let pendingRemoteData = null;

    /* قابلیت روشن ماندن دائم صفحه (Screen Wake Lock) */
    let wakeLockSentinel = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (wakeLockSentinel !== null && document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });

    requestWakeLock();

    function getLocalDuasData() {
      try {
        const stored = localStorage.getItem("parham_duas_data");
        if (stored) {
          return JSON.parse(stored);
        }
      } catch (e) {}

      return {
        version: 1,
        list: DEFAULT_DUAS
      };
    }

    function saveLocalDuasData(data) {
      try {
        localStorage.setItem("parham_duas_data", JSON.stringify(data));
      } catch (e) {}
    }

    /* محاسبه هوشمند اندازه فونت برای اشغال بالاترین سایز ممکن */
    function fitDuaText() {
      const duaEl = document.getElementById("duaText");
      const container = document.getElementById("duaContainer");
      if (!duaEl || !container || !duaEl.textContent) return;

      const availWidth = container.clientWidth;
      const availHeight = container.clientHeight;

      if (availWidth <= 0 || availHeight <= 0) return;

      let low = 12;
      let high = 70;
      let optimal = low;

      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        duaEl.style.fontSize = mid + "px";

        if (duaEl.scrollWidth <= availWidth && duaEl.scrollHeight <= availHeight) {
          optimal = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      duaEl.style.fontSize = optimal + "px";
    }

    function displayRandomDua() {
      const data = getLocalDuasData();
      const list = (data.list && data.list.length > 0) ? data.list : DEFAULT_DUAS;
      const randomIndex = Math.floor(Math.random() * list.length);
      const chosen = list[randomIndex];

      const duaEl = document.getElementById("duaText");
      if (duaEl) {
        duaEl.textContent = chosen;
        requestAnimationFrame(() => {
          fitDuaText();
        });
      }
    }

    async function checkForOnlineUpdates() {
      if (!navigator.onLine) {
        return;
      }

      try {
       const response = await fetch("./duas.json?check=1&t=" + Date.now(), {
  cache: "no-store"
});



        if (!response.ok) return;

        const remoteData = await response.json();
        const localData = getLocalDuasData();

        if (
          remoteData &&
          remoteData.version &&
          remoteData.version > (localData.version || 1) &&
          Array.isArray(remoteData.list) &&
          remoteData.list.length > 0
        ) {
          pendingRemoteData = remoteData;
          document.getElementById("updateOverlay").classList.add("show");
        }
      } catch (err) {}
    }

    function setupUpdateModal() {
      const overlay = document.getElementById("updateOverlay");
      const confirmBtn = document.getElementById("confirmUpdateBtn");
      const cancelBtn = document.getElementById("cancelUpdateBtn");

      confirmBtn.addEventListener("click", () => {
        if (pendingRemoteData) {
          saveLocalDuasData(pendingRemoteData);
          displayRandomDua();
          showToast("دعاها با موفقیت به‌روزرسانی شدند.", 2500);
        }
        overlay.classList.remove("show");
      });

      cancelBtn.addEventListener("click", () => {
        overlay.classList.remove("show");
      });
    }

    function render() {
      document.getElementById("sajdeh-val").textContent = sajdeh;
      document.getElementById("rakaat-val").textContent = rakaat;

      // اقدام بعدی: بعد از هر سجدهٔ دوم عوض می‌شود
      if (!isActive) {
        nextActionLines = [];
      } else if (sajdeh === 2) {
        const table = ACTION_TEXTS[maxRakaat];
        if (table && table[rakaat]) {
          nextActionLines = table[rakaat];
        }
      }
      document.getElementById("nextActionText").innerHTML =
        nextActionLines.map((t) => `<span>${t}</span>`).join("");

      document.getElementById("touchPrayerInfo").textContent =
        isActive ? `نماز ${selectedPrayer} - ${maxRakaat} رکعت` : "";

      // متن دعا بعد از سجدهٔ دوم رکعت دوم پنهان می‌شود
      const hideDua = isActive && (rakaat > 2 || (rakaat === 2 && sajdeh === 2));
      document.getElementById("duaContainer").style.display = hideDua ? "none" : "";
    }

    function showToast(message, duration = 3000) {
      const toast = document.getElementById("toast");

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, duration);
    }

    function changeCustom(delta) {
      customRakaatCount = Math.max(
        1,
        Math.min(50, customRakaatCount + delta)
      );

      document.getElementById(
        "customRakaatDisplay"
      ).textContent = customRakaatCount;
    }

    function startCustomPrayer() {
      startPrayer("مستحبی", customRakaatCount);
    }

    function startPrayer(name, rakaatCount) {
      selectedPrayer = name;
      maxRakaat = rakaatCount;
      rakaat = 1;
      sajdeh = 0;
      isActive = true;
      isFinished = false;
      lastCountedAt = 0;

      document
        .getElementById("selectOverlay")
        .classList.remove("show");

      document
        .getElementById("doneOverlay")
        .classList.remove("show");

      render();
    }

    /* ایجاد انیمیشن موجی لمس (Ripple Effect) */
    function createTouchRipple(e) {
      const zone = document.getElementById("touchZone");
      if (!zone) return;

      const rect = zone.getBoundingClientRect();
      const ripple = document.createElement("span");
      ripple.className = "touch-ripple";

      let clientX, clientY;
      if (e && e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if (e && e.clientX !== undefined) {
        clientX = e.clientX;
        clientY = e.clientY;
      } else {
        clientX = rect.left + rect.width / 2;
        clientY = rect.top + rect.height / 2;
      }

      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const size = Math.max(rect.width, rect.height) * 0.45;

      ripple.style.width = size + "px";
      ripple.style.height = size + "px";
      ripple.style.left = (x - size / 2) + "px";
      ripple.style.top = (y - size / 2) + "px";

      zone.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 650);
    }

    function handleTouchClick(e) {
      if (!isActive || isFinished) {
        return;
      }

      const now = Date.now();

      if (now - lastCountedAt < DEBOUNCE_MS) {
        showToast("این لمس هنوز در فاصلهٔ ۳ ثانیه‌ای قرار دارد.");
        return;
      }

      lastCountedAt = now;

      if (sajdeh === 0) {
        sajdeh = 1;
      } else if (sajdeh === 1) {
        sajdeh = 2;
      } else {
        if (rakaat < maxRakaat) {
          rakaat++;
          sajdeh = 1;
        } else {
          rakaat = maxRakaat;
          sajdeh = 2;
          isFinished = true;

          render();

          document.getElementById(
            "doneText"
          ).innerHTML = `نماز ${selectedPrayer} کامل شد<br>${maxRakaat} رکعت تمام`;

          document
            .getElementById("doneOverlay")
            .classList.add("show");

          return;
        }
      }

      createTouchRipple(e);
      animateTouchFeedback();
      render();
    }

    function animateTouchFeedback() {
      const flash = document.getElementById("flash");

      flash.classList.remove("go");

      void flash.offsetWidth;

      flash.classList.add("go");

      const cooldownFill = document.getElementById(
        "cooldownBgFill"
      );

      const zone = document.getElementById("touchZone");
      const startedAt = Date.now();

      zone.classList.add("cooldown");

      function animateCooldown() {
        const elapsed = Date.now() - startedAt;

        const percentage = Math.min(
          (elapsed / DEBOUNCE_MS) * 100,
          100
        );

        cooldownFill.style.width = `${percentage}%`;

        if (elapsed < DEBOUNCE_MS) {
          requestAnimationFrame(animateCooldown);
        } else {
          cooldownFill.style.width = "0%";
          zone.classList.remove("cooldown");
        }
      }

      requestAnimationFrame(animateCooldown);
    }

    function resetAndChoosePrayer() {
      sajdeh = 0;
      rakaat = 0;
      maxRakaat = 0;
      selectedPrayer = "";
      isActive = false;
      isFinished = false;
      lastCountedAt = 0;

      // انتخاب دعای جدید برای نماز بعدی
      displayRandomDua();

      document
        .getElementById("doneOverlay")
        .classList.remove("show");

      document
        .getElementById("selectOverlay")
        .classList.add("show");

      render();
    }

    /*
      اجرای یک عملیات با نگه داشتن دکمه.
      این تابع برای ریست و خروج استفاده می‌شود.
    */

    function setupHoldAction(
      button,
      progressElement,
      holdDuration,
      action
    ) {
      if (!button || !progressElement) {
        return;
      }

      let animationFrame = null;
      let startedAt = 0;
      let actionExecuted = false;

      function resetHold() {
        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }

        if (!actionExecuted) {
          progressElement.style.width = "0%";
        }
      }

      function updateProgress() {
        const elapsed = performance.now() - startedAt;

        const percentage = Math.min(
          (elapsed / holdDuration) * 100,
          100
        );

        progressElement.style.width = `${percentage}%`;

        if (elapsed >= holdDuration) {
          actionExecuted = true;
          progressElement.style.width = "100%";
          animationFrame = null;
          action();
          return;
        }

        animationFrame = requestAnimationFrame(updateProgress);
      }

      function startHold(event) {
        event.preventDefault();

        if (
          event.pointerId !== undefined &&
          button.setPointerCapture
        ) {
          button.setPointerCapture(event.pointerId);
        }

        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
        }

        actionExecuted = false;
        startedAt = performance.now();
        progressElement.style.width = "0%";

        animationFrame = requestAnimationFrame(updateProgress);
      }

      function cancelHold(event) {
        if (
          event &&
          event.pointerId !== undefined &&
          button.hasPointerCapture &&
          button.hasPointerCapture(event.pointerId)
        ) {
          button.releasePointerCapture(event.pointerId);
        }

        resetHold();
      }

      button.addEventListener("pointerdown", startHold);
      button.addEventListener("pointerup", cancelHold);
      button.addEventListener("pointercancel", cancelHold);
      button.addEventListener("pointerleave", cancelHold);
      button.addEventListener("lostpointercapture", resetHold);

      button.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });
    }

    /*
      ریست شمارنده با نگه داشتن ۱.۵ ثانیه (تم بنفش)
    */

    setupHoldAction(
      document.getElementById("resetBtn"),
      document.getElementById("resetProgress"),
      RESET_HOLD_MS,
      resetAndChoosePrayer
    );

    /*
      خروج از برنامه با نگه داشتن ۱ ثانیه (تم قرمز)
    */

    function tryToExitApp() {
      showToast("در حال تلاش برای خروج از برنامه...", 1800);

      let closeAttempted = false;

      try {
        closeAttempted = true;
        window.close();
      } catch (error) {
        closeAttempted = false;
      }

      setTimeout(() => {
        if (
          document.visibilityState !== "hidden" ||
          closeAttempted
        ) {
          showToast(
            "مرورگر اجازهٔ بستن مستقیم برنامه را نمی‌دهد. برای خروج از دکمهٔ برگشت یا Home گوشی استفاده کنید.",
            5000
          );
        }
      }, 500);
    }

    function setupExitButton(buttonId) {
      const button = document.getElementById(buttonId);

      if (!button) {
        return;
      }

      const progressElement = button.querySelector(
        ".exit-progress"
      );

      setupHoldAction(
        button,
        progressElement,
        EXIT_HOLD_MS,
        tryToExitApp
      );
    }

    setupExitButton("exitMainBtn");
    setupExitButton("exitSelectBtn");
    setupExitButton("exitDoneBtn");

    /*
      لمس محل شمارش
    */

    const touchZone = document.getElementById("touchZone");

    touchZone.addEventListener("pointerup", (event) => {
      event.preventDefault();
      handleTouchClick(event);
    });

    touchZone.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    /*
      پشتیبانی از صفحه‌کلید برای دسترسی بهتر
    */

    touchZone.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" ||
        event.key === " "
      ) {
        event.preventDefault();
        handleTouchClick(event);
      }
    });

    // تنظیم مجدد اندازه فونت هنگام تغییر ابعاد صفحه
    window.addEventListener("resize", () => {
      fitDuaText();
    });

    // راه‌اندازی اولیه
    setupUpdateModal();
    displayRandomDua();
    checkForOnlineUpdates();
    render();

// ثبت Service Worker برای آفلاین شدن PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(console.error);
  });
}

    
  </script>

</body>
