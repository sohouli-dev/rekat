<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>رکعت شمار پرهام</title>

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #111827;
    --surface: #1f2937;
    --border: #374151;
    --text: #f9fafb;
    --muted: #9ca3af;
    --accent: #10b981;
    --accent2: #6366f1;
    --danger: #ef4444;
    --danger-bg: #450a0a;
    --touch-bg: #1e293b;
    --touch-act: #334155;
    --touch-wait: #0f172a;
    --r-lg: 16px;
    --r-xl: 20px;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .app-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 10px 14px;
  }

  .touch-wrap {
    flex: 1;
    width: 100%;
    position: relative;
    display: flex;
    overflow: hidden;
    border-radius: var(--r-xl);
  }

  .touch-zone {
    width: 100%;
    height: 100%;
    background: var(--touch-bg);
    border: 2px dashed var(--border);
    border-radius: var(--r-xl);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .touch-zone.cooldown {
    background: var(--touch-wait);
    border-color: #4b5563;
  }

  .cooldown-bg-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 0%;
    background: rgba(99, 102, 241, 0.25);
    pointer-events: none;
    z-index: 1;
  }

  .touch-content-wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .touch-label {
    font-size: 17px;
    color: var(--text);
    font-weight: 700;
    text-align: center;
    line-height: 1.8;
  }

  .touch-sublabel {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* مشخصات نشانگر نماز در پایین وسط کادر لمس */
  .current-prayer-badge {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    z-index: 2;
    pointer-events: none;
    background: rgba(17, 24, 39, 0.7);
    padding: 3px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .flash {
    position: absolute;
    inset: 0;
    border-radius: var(--r-xl);
    background: rgba(16, 185, 129, 0.25);
    opacity: 0;
    pointer-events: none;
    z-index: 3;
  }

  .flash.go {
    animation: flash-anim 250ms ease forwards;
  }

  @keyframes flash-anim {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  .bottom-row {
    display: flex;
    width: 100%;
    gap: 10px;
    margin-top: 8px;
    height: 90px;
  }

  .counter-card {
    flex: 2;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--r-lg);
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .counter-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .counter-value {
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
  }

  .counter-card.sajdeh .counter-value { color: var(--accent2); }
  .counter-card.rakaat .counter-value { color: var(--accent); }

  .center-controls {
    flex: 1.4;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .fullscreen-btn {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: var(--r-lg);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .fullscreen-btn:active {
    background: var(--touch-act);
  }

  .reset-btn-inline {
    flex: 1.3;
    background: var(--danger-bg);
    color: var(--danger);
    border: 1.5px solid #7f1d1d;
    border-radius: var(--r-lg);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .reset-progress {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 0%;
    height: 4px;
    background: var(--danger);
  }

  .select-overlay, .done-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 15, 0.96);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 9999;
  }

  .select-overlay.show, .done-overlay.show {
    display: flex !important;
  }

  .select-box {
    width: min(500px, 100%);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--r-xl);
    padding: 16px 20px;
    text-align: center;
  }

  .select-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .select-description {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 12px;
  }

  .prayer-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .prayer-btn {
    min-height: 48px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--touch-bg);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .prayer-btn:active {
    background: var(--touch-act);
  }

  .custom-section {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    background: var(--bg);
    padding: 6px 10px;
    border-radius: 14px;
    border: 1px solid var(--border);
  }

  .stepper-label {
    font-size: 12px;
    color: var(--muted);
  }

  .stepper-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .step-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--touch-bg);
    color: var(--text);
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
  }

  .stepper-value {
    min-width: 30px;
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
    text-align: center;
  }

  .custom-submit-btn {
    flex: 1;
    height: 36px;
    background: var(--accent);
    color: #064e3b;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .done-box {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .done-text {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.8;
  }

  .done-reset {
    padding: 12px 32px;
    background: var(--accent);
    color: #064e3b;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .orient-hint {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 15, 0.98);
    color: var(--text);
    font-size: 18px;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    z-index: 99999;
  }

  @media (orientation: portrait) {
    .orient-hint { display: flex; }
  }
</style>
</head>

<body>

<div class="orient-hint">
  📱 لطفاً برای استفاده، گوشی را به حالت افقی نگه دارید
</div>

<div class="app-container">

  <div class="touch-wrap">
    <div class="touch-zone" id="touchZone" onclick="handleTouchClick()">
      <div class="cooldown-bg-fill" id="cooldownBgFill"></div>
      <div class="touch-content-wrapper">
        <span class="touch-label" id="touchMainLabel">محل حساس به لمس</span>
        <span class="touch-sublabel" id="touchSubLabel">لمس با فاصله کمتر از ۳ ثانیه شمرده نمی‌شود</span>
      </div>
      <!-- نوشته نماز در پایین وسط کادر لمس -->
      <span id="currentPrayerLabel" class="current-prayer-badge">هنوز نمازی انتخاب نشده</span>
    </div>
    <div class="flash" id="flash"></div>
  </div>

  <div class="bottom-row">
    <div class="counter-card sajdeh">
      <span class="counter-label">سجده</span>
      <span class="counter-value" id="sajdeh-val">0</span>
    </div>

    <!-- دکمه تمام‌صفحه و ریست -->
    <div class="center-controls">
      <button class="fullscreen-btn" id="fullscreenToggleBtn">⛶ تمام‌صفحه</button>
      <button class="reset-btn-inline" id="resetBtn">
        <span>ریست شمارنده</span>
        <span style="font-size:9px; opacity:0.8;">(نگه داشتن ۱.۵ ثانیه)</span>
        <div class="reset-progress" id="resetProgress"></div>
      </button>
    </div>

    <div class="counter-card rakaat">
      <span class="counter-label">رکعت</span>
      <span class="counter-value" id="rakaat-val">0</span>
    </div>
  </div>

  <div class="select-overlay show" id="selectOverlay">
    <div class="select-box">
      <div class="select-title">انتخاب نوع نماز</div>
      <div class="select-description">یک نماز را انتخاب کنید:</div>

      <div class="prayer-options">
        <button type="button" class="prayer-btn" onclick="startPrayer('صبح', 2)">صبح (۲ رکعت)</button>
        <button type="button" class="prayer-btn" onclick="startPrayer('ظهر', 4)">ظهر (۴ رکعت)</button>
        <button type="button" class="prayer-btn" onclick="startPrayer('عصر', 4)">عصر (۴ رکعت)</button>
        <button type="button" class="prayer-btn" onclick="startPrayer('مغرب', 3)">مغرب (۳ رکعت)</button>
        <button type="button" class="prayer-btn" onclick="startPrayer('عشا', 4)">عشا (۴ رکعت)</button>

        <div class="custom-section">
          <span class="stepper-label">رکعت:</span>
          <div class="stepper-controls">
            <button type="button" class="step-btn" onclick="changeCustom(-1)">−</button>
            <span class="stepper-value" id="customRakaatDisplay">1</span>
            <button type="button" class="step-btn" onclick="changeCustom(1)">+</button>
          </div>
          <button type="button" class="custom-submit-btn" onclick="startCustomPrayer()">شروع مستحبی</button>
        </div>
      </div>
    </div>
  </div>

  <div class="done-overlay" id="doneOverlay">
    <div class="done-box">
      <div class="done-text" id="doneText"></div>
      <button class="done-reset" onclick="resetAndChoosePrayer()">نماز جدید</button>
    </div>
  </div>

</div>

<script>
  let sajdeh = 0;
  let rakaat = 0;
  let maxRakaat = 0;
  let selectedPrayer = '';
  let isActive = false;
  let isFinished = false;
  let lastCountedAt = 0;
  let customRakaatCount = 1;
  const DEBOUNCE_MS = 3000;

  function render() {
    document.getElementById('sajdeh-val').textContent = sajdeh;
    document.getElementById('rakaat-val').textContent = rakaat;
  }

  function changeCustom(delta) {
    customRakaatCount = Math.max(1, Math.min(50, customRakaatCount + delta));
    document.getElementById('customRakaatDisplay').textContent = customRakaatCount;
  }

  function startCustomPrayer() {
    startPrayer('مستحبی', customRakaatCount);
  }

  function startPrayer(name, rakaatCount) {
    selectedPrayer = name;
    maxRakaat = rakaatCount;
    rakaat = 1;
    sajdeh = 0;
    isActive = true;
    isFinished = false;
    lastCountedAt = 0;

    document.getElementById('currentPrayerLabel').textContent = `نماز ${selectedPrayer} (${maxRakaat} رکعت)`;
    document.getElementById('selectOverlay').classList.remove('show');
    document.getElementById('doneOverlay').classList.remove('show');

    render();
  }

  function handleTouchClick() {
    if (!isActive || isFinished) return;

    const now = Date.now();
    if (now - lastCountedAt < DEBOUNCE_MS) return;
    lastCountedAt = now;

    if (sajdeh === 0) {
      sajdeh = 1;
    } else if (sajdeh === 1) {
      sajdeh = 2;
    } else {
      if (rakaat < maxRakaat) {
        rakaat++;
        sajdeh = 1;
      } else {
        rakaat = maxRakaat;
        sajdeh = 2;
        isFinished = true;
        render();
        document.getElementById('doneText').innerHTML = `نماز ${selectedPrayer} کامل شد 🌙<br>${maxRakaat} رکعت تمام`;
        document.getElementById('doneOverlay').classList.add('show');
        return;
      }
    }

    // افکت فلش
    const flash = document.getElementById('flash');
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');

    render();

    // انیمیشن کول‌داون ۳ ثانیه
    const cooldownFill = document.getElementById('cooldownBgFill');
    const start = Date.now();
    const zone = document.getElementById('touchZone');
    zone.classList.add('cooldown');

    function animateCooldown() {
      const elapsed = Date.now() - start;
      const pct = Math.min((elapsed / DEBOUNCE_MS) * 100, 100);
      cooldownFill.style.width = pct + '%';
      if (elapsed < DEBOUNCE_MS) {
        requestAnimationFrame(animateCooldown);
      } else {
        cooldownFill.style.width = '0%';
        zone.classList.remove('cooldown');
      }
    }
    requestAnimationFrame(animateCooldown);
  }

  function resetAndChoosePrayer() {
    sajdeh = 0;
    rakaat = 0;
    maxRakaat = 0;
    isActive = false;
    isFinished = false;
    document.getElementById('currentPrayerLabel').textContent = 'هنوز نمازی انتخاب نشده';
    document.getElementById('doneOverlay').classList.remove('show');
    document.getElementById('selectOverlay').classList.add('show');
    render();
  }

  // دکمه ریست با نگه‌داشتن ۱.۵ ثانیه
  const resetBtn = document.getElementById('resetBtn');
  const resetProgress = document.getElementById('resetProgress');
  let resetTimer = null;
  let resetStartTime = 0;

  function cancelReset() {
    if (resetTimer) cancelAnimationFrame(resetTimer);
    resetProgress.style.width = '0%';
  }

  function startResetHold() {
    resetStartTime = Date.now();
    function tick() {
      const elapsed = Date.now() - resetStartTime;
      const pct = Math.min((elapsed / 1500) * 100, 100);
      resetProgress.style.width = pct + '%';
      if (elapsed >= 1500) {
        cancelReset();
        resetAndChoosePrayer();
      } else {
        resetTimer = requestAnimationFrame(tick);
      }
    }
    resetTimer = requestAnimationFrame(tick);
  }

  resetBtn.addEventListener('mousedown', startResetHold);
  resetBtn.addEventListener('mouseup', cancelReset);
  resetBtn.addEventListener('mouseleave', cancelReset);
  resetBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startResetHold(); });
  resetBtn.addEventListener('touchend', cancelReset);

  // دکمه تمام‌صفحه
  document.getElementById('fullscreenToggleBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });

  render();
</script>

</body>
</html>
